name: Go quality gates

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "migrations/**"
      - "deploy/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "migrations/**"
      - "deploy/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: visual
          POSTGRES_PASSWORD: visualtest
          POSTGRES_DB: visual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visual -d visual"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: Resolve dependencies
        run: go mod tidy
      - name: Verify module files are committed
        run: git diff --exit-code -- go.mod go.sum

      - name: Verify Go formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d cmd internal
            echo "Go sources must be formatted before merge."
            exit 1
          fi
      - name: Static analysis
        run: go vet ./...
      - name: Build every entrypoint
        run: go build ./...
      # The PostgreSQL service image already contains psql. Reuse it rather
      # than depending on an apt package mirror during every CI run.
      - name: Apply initial migrations
        run: |
          container_id="$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          for migration in migrations/*.sql; do
            docker exec -i -e PGPASSWORD=visualtest "$container_id" \
              psql -h 127.0.0.1 -U visual -d visual -v ON_ERROR_STOP=1 < "$migration"
          done

      - name: Verify migrations are safe to reapply
        run: |
          container_id="$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          for migration in migrations/*.sql; do
            docker exec -i -e PGPASSWORD=visualtest "$container_id" \
              psql -h 127.0.0.1 -U visual -d visual -v ON_ERROR_STOP=1 < "$migration"
          done

      - name: Unit and PostgreSQL integration tests
        env:
          DB_TEST_URL: postgres://visual:visualtest@127.0.0.1:5432/visual?sslmode=disable
        run: go test -race -count=1 ./...

      - name: ZIP validator 10-second fuzz smoke test
        run: go test ./internal/validator -run=^$ -fuzz=FuzzValidateZIPDoesNotPanic -fuzztime=10s -parallel=2
