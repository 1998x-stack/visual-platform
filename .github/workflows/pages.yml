name: Build and publish Visual Platform docs

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/visual-platform-core-technical-design.pdf"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: visual-platform-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.pages_setup.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install documentation tooling
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install CJK fonts for PDF rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Validate documentation
        run: npm run check

      - name: Render PDF
        run: npm run build:pdf

      - name: Commit generated PDF
        run: |
          if [ -n "$(git status --porcelain -- docs/visual-platform-core-technical-design.pdf)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/visual-platform-core-technical-design.pdf
            git commit -m "docs: regenerate Visual Platform technical PDF"
            git push
          fi

      - name: Configure Pages
        id: pages_setup
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explain Pages setup requirement
        if: steps.pages_setup.outcome != 'success'
        run: echo "::warning::PDF and HTML are committed. Enable Settings > Pages > Source = GitHub Actions to activate the public site."

      - name: Upload Pages artifact
        if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
