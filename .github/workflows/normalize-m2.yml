name: Normalize M2 Go modules (temporary)

on:
  push:
    branches: [feat/m2-quarantine-upload]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2-quarantine-upload
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: false
      - name: Tidy modules and format Go
        run: |
          go mod tidy
          gofmt -w cmd internal
      - name: Commit generated lockfile and formatting
        run: |
          git add go.mod go.sum cmd internal
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(go): lock M2 storage dependencies and format sources"
            git push origin HEAD:feat/m2-quarantine-upload
          fi
